<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mailgun">
  <title>Mailgun</title>
  <!--
    A paper plane in flight: the send-and-track half of the plugin, drawn
    without the red of the Mailgun brand so the set reads as one family.
    Bold and digital ink plate, brand cyan glyph, paper fold.
  -->
  <defs>
    <linearGradient id="mg-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#091c36"/>
      <stop offset="1" stop-color="#05121f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#mg-plate)"/>

  <!-- the upper wing -->
  <path d="M12 26 L50 15 L26 31 Z" fill="#57ebee"/>
  <!-- the lower fold, in paper, so the plane still reads in greyscale -->
  <path d="M12 26 L26 31 L21 44 Z" fill="#ffffff"/>

  <!-- monogram -->
  <rect x="36" y="42" width="24" height="18" rx="6" fill="#091c36" stroke="#57ebee" stroke-width="2"/>
  <text x="48" y="55" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">MG</text>
</svg>
